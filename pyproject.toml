[project]
name = "lore-core"
version = "0.1.0"
description = "LORE Python core backend (FastAPI) — see docs/PDR_core_build_v1.0.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "PyJWT>=2.13",
    "google-generativeai>=0.8",
    "groq>=0.37",
    "openai>=2.54",
    "posthog>=5.4",
    "sentry-sdk>=2.14",
    "python-json-logger>=2.0",
    "playwright>=1.62",
    "aioapns>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole test session, not one per test function: the
# async engine in app/db/session.py is created once at import time and binds
# its connection pool to whichever loop first uses it, so a per-test loop
# (pytest-asyncio's default) causes "Future attached to a different loop"
# errors on the second async DB test. Standard fix for a module-level async
# engine shared across tests.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's dependency injection idiom is Depends(...) as a parameter
# default — that's the correct pattern here, not the mutable-default-argument
# bug the rule is meant to catch. Ignored project-wide since every router in
# this app uses it.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
